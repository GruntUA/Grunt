# `grunt release` commits `chore(release): vX.Y.Z` (the new CHANGELOG.md section)
# and opens the pull request into master. Once it is merged, this workflow tags that
# commit (annotated, the message is the changelog section) and publishes the GitHub
# release. CI already ran on the pull request, and test.yml runs again on the push.
# A squash merge leaves `chore(release): vX.Y.Z (#N)` - that commit is tagged then.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read # publish raises it to write for the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## v\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CHANGELOG.md | head -n1)
          if [ -z "$version" ]; then
            echo "No release section in CHANGELOG.md"
            exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged"
            exit 0
          fi

          commit=$(git log --format='%H%x09%s' HEAD |
            awk -F '\t' -v s="chore(release): $tag" \
              '$2 == s || index($2, s " (#") == 1 { print $1; exit }')
          if [ -z "$commit" ]; then
            echo "::error::CHANGELOG.md has $tag but no 'chore(release): $tag' commit"
            exit 1
          fi

          git show "$commit:CHANGELOG.md" | awk '/^## v/ { n++ } n == 1' > "$RUNNER_TEMP/notes.md"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" -F "$RUNNER_TEMP/notes.md" "$commit"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
