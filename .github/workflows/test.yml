# The full suite. Locally run only what a change touches: `grunt test --changed`.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # release.yml runs it before publishing a tag

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: test-secret-key-for-ci-only

jobs:
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package version comes from git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --all-extras

      - name: ruff
        run: uv run ruff check grunt tests

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: pyright
        run: npx -y pyright@1.1.414 grunt

  backend:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            url: "sqlite+aiosqlite://"
          - db: postgres
            url: "postgresql+asyncpg://grunt:grunt@localhost:5432/grunt_test"
    # PostgreSQL support is not verified yet - report, do not block.
    continue-on-error: ${{ matrix.db == 'postgres' }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grunt
          POSTGRES_PASSWORD: grunt
          POSTGRES_DB: grunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --all-extras

      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
        run: uv run pytest -q -n auto --dist loadfile

  frontend:
    name: vitest + vue-tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      # package-lock.json is not committed, so no `npm ci`.
      - run: npm install --no-audit --no-fund

      - name: vue-tsc
        run: npx vue-tsc --noEmit

      - name: vitest
        run: npx vitest run
