# The full suite. Locally run only what a change touches: `grunt test --changed`.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # release.yml runs it before publishing a tag

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: test-secret-key-for-ci-only

jobs:
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package version comes from git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - run: uv sync --locked --all-extras

      - name: ruff
        run: uv run ruff check grunt tests

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: pyright
        run: npx -y pyright@1.1.414 grunt

  backend:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            url: "sqlite+aiosqlite://"
          - db: postgres
            url: "postgresql+asyncpg://grunt:grunt@localhost:5432/grunt_test"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grunt
          POSTGRES_PASSWORD: grunt
          POSTGRES_DB: grunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - run: uv sync --locked --all-extras

      # Test data is thrown away, and every test creates and drops all DocType
      # tables - durability (an fsync per commit) only slows that DDL down.
      # All three settings take effect on reload, no restart needed.
      - name: Tune PostgreSQL for tests
        if: matrix.db == 'postgres'
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U grunt -d grunt_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
        run: uv run pytest -q -n auto --dist loadfile

  frontend:
    name: vitest + vue-tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: vue-tsc
        run: npx vue-tsc --noEmit

      - name: vitest
        run: npx vitest run
