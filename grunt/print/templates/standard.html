<!DOCTYPE html>
<html lang="{{ lang | default('uk') }}">
{% from "print_macros.html" import print_styles, render_layout %}

<head>
  <meta charset="UTF-8">
  <title>{{ doctype_label }} {{ doc.name }}</title>
  <style>
    @page {
      size: A4;
      margin: 1.5cm;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-size: 10.5pt;
      color: #333;
    }

    /* The page margins are @page's - on screen the same whitespace around a sheet. */
    @media screen {
      body {
        max-width: 21cm;
        margin: 0 auto;
        padding: 1.5cm;
      }
    }

    .header {
      border-bottom: 3px solid #2D6A4F;
      padding-bottom: 10px;
      margin-bottom: 8px;
    }

    .header h1 {
      color: #2D6A4F;
      font-size: 18pt;
      margin-bottom: 4px;
    }

    .header .doc-name {
      color: #666;
      font-size: 11pt;
    }

    .footer {
      margin-top: 28px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      color: #999;
      font-size: 8.5pt;
      display: flex;
      justify-content: space-between;
    }

    {{ print_styles() }}
  </style>
</head>

<body>
  <div class="header">
    <h1>{{ title or doctype_label }}</h1>
    <div class="doc-name">{% if title %}{{ doctype_label }} · {% endif %}{{ doc.name }}</div>
  </div>

  {{ render_layout(layout) }}

  <div class="footer">
    <span>{{ doc.owner }}</span>
    <span>{{ now | datetime_format }}</span>
  </div>
</body>

</html>
