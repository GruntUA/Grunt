{#- Minimal header of the framework's own pages. An app with a site (the CMS)
    ships its own _navbar.html / _base.html - see the website_templates hook. -#}
<header class="glass" style="position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border-color);">
    <div class="container" style="height: 4.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
        <a href="/" style="display: flex; align-items: center; gap: 0.75rem; min-width: 0; text-decoration: none; color: var(--text-main);">
            {% if site_logo %}
                <img src="{{ site_logo }}" alt="" style="height: 2.25rem;">
            {% else %}
                <span style="width: 2.25rem; height: 2.25rem; flex: none; background: var(--primary); border-radius: 0.5rem; display: grid; place-items: center; color: white; font-weight: 700;">{{ site_name[0] }}</span>
            {% endif %}
            <span style="font-weight: 700; font-size: 1.25rem; letter-spacing: -0.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ site_name }}</span>
        </a>
        <span id="gr-nav-auth" style="display: none;">
            <a href="/app" class="btn btn-primary" style="padding: 0.5rem 1rem;">{{ _("Go to the app") }}</a>
        </span>
        <span id="gr-nav-guest" style="display: none;">
            <a href="/login" class="btn btn-primary" style="padding: 0.5rem 1rem;">{{ _("Sign in") }}</a>
        </span>
    </div>
</header>
<script>
    // JWT lives only in localStorage (not a cookie), so SSR can't know the auth
    // state at render time — decide client-side, same key the SPA auth store uses.
    (function () {
        var authed = !!localStorage.getItem('grunt_token');
        document.getElementById(authed ? 'gr-nav-auth' : 'gr-nav-guest').style.display = 'inline-block';
    })();
</script>
