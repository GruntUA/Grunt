<section class="wp-block wp-cta container" style="text-align: center; padding: 4rem 0;">
    {% if block.title %}<h2>{{ block.title }}</h2>{% endif %}
    {% if block.settings.subtitle %}<p class="wp-hero-subtitle">{{ block.settings.subtitle }}</p>{% endif %}
    {% if block.settings.link_url %}
        <a href="{{ block.settings.link_url }}" class="btn btn-primary" style="padding: 1rem 2rem;">{{ block.settings.link_label or block.settings.link_url }}</a>
    {% endif %}
</section>
