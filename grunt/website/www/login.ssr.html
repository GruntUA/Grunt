{% extends "_base.html" %}

{% block title %}Вхід — Ґрунт{% endblock %}

{% block head %}
<style>
    .auth-card {
        max-width: 450px;
        width: 100%;
        margin: 6rem auto;
        padding: 3rem;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-main);
    }

    .form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        background: white;
        transition: all 0.2s;
        font-size: 1rem;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .alert {
        padding: 1rem;
        border-radius: var(--radius-md);
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
    }

    .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
    }
</style>
{% endblock %}

{% block body %}
<div class="container">
    <div class="auth-card glass animate-fade-in">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Ласкаво просимо</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Увійдіть у свій аккаунт, щоб продовжити</p>
        </div>

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label class="form-label" for="email">Електронна пошта</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@company.com" required value="{{ email or '' }}">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label class="form-label" for="password" style="margin-bottom: 0;">Пароль</label>
                    <a href="/forgot-password" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Забули пароль?</a>
                </div>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="remember" name="remember" style="width: 1rem; height: 1rem; cursor: pointer;">
                <label for="remember" style="font-size: 0.9rem; color: var(--text-muted); cursor: pointer;">Запам'ятати мене</label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 3rem; font-size: 1rem; margin-top: 1rem;">
                Увійти
            </button>
        </form>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.95rem; color: var(--text-muted);">
            Немає аккаунту? <a href="/signup" style="color: var(--primary); text-decoration: none; font-weight: 600;">Зареєструватися</a>
        </div>
    </div>
</div>
{% endblock %}
