[tools]
node = "26"
uv = "latest"


[tasks.deps]
run = """
uv sync --all-extras --all-packages --inexact
uv run python -m grunt.cli.main app deps
npm install
"""
description = "Sync Python and Node.js dependencies"

[tasks.setup]
run = """
mise run deps
mise run bootstrap
mise run db:migrate
"""
description = "Full project setup: install runtimes, sync packages, and migrate DB"

[tasks.backend]
run = """
trap 'kill $CHILD 2>/dev/null; exit 0' TERM INT
uv run uvicorn grunt.main:app --host ${HOST:-0.0.0.0} --port ${PORT:-8000} ${RELOAD} &
CHILD=$!
wait $CHILD
"""
description = "Start only the FastAPI backend server"

[tasks.frontend]
run = """
trap 'kill $CHILD 2>/dev/null; exit 0' TERM INT
npm run dev &
CHILD=$!
wait $CHILD
"""
description = "Start only the Vite frontend dev server"

[tasks.worker]
run = """
trap 'kill $CHILD 2>/dev/null; exit 0' TERM INT
# With `grunt serve` in reload mode (RELOAD set) the worker restarts on code
# changes too — watching the framework and every app package, like uvicorn.
RELOAD_ARGS=""
if [ -n "$RELOAD" ]; then
  RELOAD_ARGS="--reload --reload-dir grunt"
  for app in ../*/; do
    name=$(basename "$app")
    [ "$name" != grunt ] && [ -d "$app$name" ] && RELOAD_ARGS="$RELOAD_ARGS --reload-dir $app$name"
  done
fi
uv run taskiq worker grunt.tasks.worker:broker --workers ${WORKERS:-1} --no-configure-logging $RELOAD_ARGS &
CHILD=$!
wait $CHILD
"""
description = "Start the TaskIQ background worker (needs REDIS_URL)"

[tasks.bootstrap]
run = "uv run python bootstrap_site.py"
description = "Initialize database and core doctypes"

[tasks."db:migrate"]
run = "uv run alembic -c alembic.ini upgrade head"
description = "Apply database migrations"

[tasks.db-reset]
run = "uv run alembic -c alembic.ini downgrade base && uv run alembic -c alembic.ini upgrade head"
description = "Reset developer database (CAUTION: wipes all data)"

[tasks.test]
depends = ["test-py", "test-js"]
description = "Run all tests"

[tasks.test-py]
run = "uv run pytest tests/ -v --tb=short"
description = "Run Python backend tests"

[tasks.test-js]
run = "npm test -- --run"
description = "Run Vitest frontend tests"

[tasks.lint]
run = "uv run ruff check . --fix && npm run lint 2>/dev/null || true"
description = "Run linting for Python and JavaScript"

[tasks.typecheck]
run = "uv run mypy -p grunt && npm run typecheck"
description = "Run type checks for Python and TypeScript"

[tasks.build]
run = "npm run build"
description = "Build the frontend for production"

[tasks.clean]
run = "find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true && rm -rf frontend/dist frontend/node_modules/.vite .pytest_cache .mypy_cache .ruff_cache"
description = "Clean build artifacts and caches"
