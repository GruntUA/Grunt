site_name: Grunt Framework
site_description: Metadata-driven application framework for building business apps
site_url: https://grunt.dev
repo_url: https://github.com/your-org/grunt
repo_name: your-org/grunt

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

plugins:
  - search
  - autorefs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Core Concepts:
    - DocType: concepts/doctype.md
    - Fields: concepts/fields.md
    - Workflow: concepts/workflow.md
    - Permissions: concepts/permissions.md
  - Developer Guide:
    - Creating an App: guide/create-app.md
    - Controllers: guide/controllers.md
    - Hooks: guide/hooks.md
    - Server Scripts: guide/server-scripts.md
    - Background Tasks: guide/background-tasks.md
    - Reports: guide/reports.md
  - API Reference:
    - REST API: api/rest.md
    - GruntApp SDK: api/grunt-app.md
    - WebSocket: api/websocket.md
  - Deployment:
    - Docker: deployment/docker.md
    - Environment Variables: deployment/env-vars.md
    - Security: deployment/security.md
