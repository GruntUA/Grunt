events { worker_connections 1024; }

http {
    upstream backend { server backend:8000; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static assets from app public/ directories
        location /assets/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public";
        }

        # Desk SPA — all /app/* requests go to Vue frontend
        location /app/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Redirect bare /app to /app/
        location = /app {
            return 301 /app/;
        }

        # Legacy redirects for pre-/app auth & public routes
        location ~ ^/(login|forgot-password|reset-password|mfa-verify|setup|form|share|public|403)(/.*)?$ {
            return 302 /app$request_uri;
        }

        # Public www pages served by backend (Jinja2)
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
