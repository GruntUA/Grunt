[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grunt"
version = "0.1.0"
description = "Metadata-driven application framework"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database (core — SQLAlchemy multi-DB)
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",       # SQLite async driver (dev/testing)

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Logging
    "structlog>=24.1.0",

    # Logging output
    "rich>=13.7.0",

    # HTTP client (для internal requests)
    "httpx>=0.27.0",

    # Export (xlsx)
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]
mysql = [
    "aiomysql>=0.2.0",
]
redis = [
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.3.0",
]
docs = [
    "docxtpl>=0.16.8",
    "weasyprint>=62.0",
    "openpyxl>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/grunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["B008"]  # FastAPI Depends()

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
