[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grunt"
version = "0.1.0"
description = "Metadata-driven application framework"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "click>=8.1.0",
    # Database (core — SQLAlchemy multi-DB)
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",       # SQLite async driver (dev/testing)
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Logging
    "structlog>=24.1.0",
    # Logging output
    "rich>=13.7.0",
    # HTTP client (для internal requests)
    "httpx>=0.27.0",
    # Export (xlsx)
    "openpyxl>=3.1.0",
    # Background Jobs
    "taskiq>=0.11.0",
    "taskiq-redis>=0.5.0",
    "apscheduler>=3.10.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    "pywebpush>=2.0.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.6",
    "docxtpl>=0.16.8",
    "simpleeval>=1.0.7",
    # Ukrainian name/position declension for print filters (grunt/print/filters.py)
    "shevchenko>=1.0.0",
    "pymorphy3>=2.0.0",
    "pymorphy3-dicts-uk>=2.4.1",
]

[project.scripts]
grunt = "grunt.cli.main:cli"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",       # async driver (runtime)
    "psycopg2-binary>=2.9.0", # sync driver for Alembic migrations
]
mysql = [
    "aiomysql>=0.2.0",       # async driver (runtime)
    "pymysql>=1.1.0",        # sync driver for Alembic migrations
]
redis = [
    "redis[hiredis]>=5.0.0",
]
docs = [
    "docxtpl>=0.16.8",
    "weasyprint>=62.0",
    "openpyxl>=3.1.0",
    "sqlparse>=0.5.0",
]
mfa = [
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
]
oauth = [
    "authlib>=1.3.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["grunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC"]
ignore = [
    "B008",  # FastAPI Depends() requires call in argument default
    "TC001", # Pydantic model fields need runtime imports for get_type_hints()
    "TC002", # same for third-party types used in Pydantic fields
]

[tool.ruff.lint.per-file-ignores]
"grunt/db/base.py" = ["TC003"]       # datetime in Mapped[] needs runtime for SQLAlchemy
"grunt/db/system_tables.py" = ["TC003"]  # same

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

# Checks enabled (subset of strict that the codebase satisfies)
warn_redundant_casts = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true
