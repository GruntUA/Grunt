[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "grunt"
# From git tags vX.Y.Z (hatch-vcs); grunt.version computes the same at runtime.
dynamic = ["version"]
description = "Metadata-driven application framework"
requires-python = ">=3.15"
dependencies = [
    # Web framework
    "fastapi>=0.143.1",
    "packaging>=26.3",         # versions and required_grunt specifiers
    "uvicorn[standard]>=0.54.0",
    "click>=8.5.0",
    # Database (core — SQLAlchemy multi-DB)
    "sqlalchemy[asyncio]>=2.1.4",
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",       # SQLite async driver (dev/testing)
    # Validation
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.4",
    # Auth
    "pyjwt>=2.15.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.32",
    "pyotp>=2.10.0",              # MFA / TOTP
    "qrcode[pil]>=8.2",        # MFA QR codes
    "authlib>=1.9.1",            # OIDC / OAuth login providers
    "webauthn>=3.0.1",           # passkeys / WebAuthn
    # Logging
    "structlog>=26.1.0",
    # Logging output
    "rich>=15.0.0",
    # HTTP client (outgoing requests; starlette's TestClient and authlib use it too)
    "httpx2>=2.13.1",
    # Export (xlsx)
    "openpyxl>=3.1.5",
    # Background Jobs
    "taskiq[reload]>=0.13.0",
    "taskiq-redis>=1.2.4",
    "apscheduler>=3.11.3",
    "aiosmtplib>=5.1.3",
    "aioimaplib>=2.0.3",
    "pywebpush>=2.5.0",
    "pandas>=3.0.6",
    "jinja2>=3.1.6",
    "docxtpl>=0.20.2",
    "playwright>=1.64.0",   # HTML→PDF via headless Chromium (grunt/print/pdf.py)
    "simpleeval>=1.0.8",
    # Ukrainian name/position declension for print filters (grunt/print/filters.py)
    "shevchenko>=1.0.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
    "restrictedpython>=8.5",
    "polib>=1.2.0",              # PO/POT read/write for `grunt i18n` (i18n/extract.py)
    "pypdfium2>=5.14.0",
    "nh3>=0.3.7",
    "segno>=1.6.6",             # QR codes in print templates (grunt/print/filters.py)
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.32.0",       # async driver (runtime)
    "psycopg2-binary>=2.9.13", # sync driver for Alembic migrations
]
mysql = [
    "aiomysql>=0.3.2",       # async driver (runtime)
    "pymysql>=1.2.3",        # sync driver for Alembic migrations
]
redis = [
    # Without the [hiredis] extra: hiredis (C parser) has no Python 3.15 wheels
    # yet and a server has no compiler to build it - redis-py uses its own
    # parser. Back to "redis[hiredis]" once https://pypi.org/project/hiredis/#files
    # lists cp315.
    "redis>=8.1.0",
]
docs = [
    "docxtpl>=0.20.2",
    "playwright>=1.64.0",
    "openpyxl>=3.1.5",
    "sqlparse>=0.6.0",
]

# Dev tooling lives in a dependency-group (PEP 735), NOT an extra: `uv sync`
# installs the default groups automatically, so a plain `uv sync` can never
# strip pytest/ruff/mypy the way `--extra`-gated deps get dropped.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",   # -n auto --dist loadfile: each file stays on one worker
    "ruff>=0.17.0",
    "mypy>=2.4.0",
]

[tool.hatch.version]
source = "vcs"
# An archive without .git still builds.
raw-options = { fallback_version = "0.0.0" }

[tool.uv]
# Rebuild the editable install's metadata when HEAD or the tags move.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["grunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole run: the in-memory test DB is a single shared
# connection (StaticPool), and its asyncio lock binds to the loop it first
# waited in - a per-test loop broke whichever later test contended for it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "grunt"]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["."]

[tool.ruff.lint]
# No "TC": type-only imports are plain `lazy from ... import ...` at the top of
# the module (PEP 810), not `if TYPE_CHECKING:` blocks.
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() requires call in argument default
]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

# Checks enabled (subset of strict that the codebase satisfies)
warn_redundant_casts = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true
