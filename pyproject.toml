[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grunt"
version = "0.1.0"
description = "Metadata-driven application framework"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "click>=8.1.0",
    # Database (core — SQLAlchemy multi-DB)
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",       # SQLite async driver (dev/testing)
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pyotp>=2.10.0",              # MFA / TOTP
    "qrcode[pil]>=8.2",        # MFA QR codes
    "authlib>=1.8.0",            # OIDC / OAuth login providers
    "webauthn>=3.0.0",           # passkeys / WebAuthn
    # Logging
    "structlog>=24.1.0",
    # Logging output
    "rich>=13.7.0",
    # HTTP client (outgoing requests; starlette's TestClient and authlib use it too)
    "httpx2>=2.13.1",
    # Export (xlsx)
    "openpyxl>=3.1.0",
    # Background Jobs
    "taskiq[reload]>=0.11.0",
    "taskiq-redis>=0.5.0",
    "apscheduler>=3.10.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    "pywebpush>=2.0.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.6",
    "docxtpl>=0.16.8",
    "playwright>=1.40.0",   # HTML→PDF via headless Chromium (grunt/print/pdf.py)
    "simpleeval>=1.0.7",
    # Ukrainian name/position declension for print filters (grunt/print/filters.py)
    "shevchenko>=1.0.0",
    "pymorphy3>=2.0.0",
    "pymorphy3-dicts-uk>=2.4.1",
    "restrictedpython>=8.4",
    "polib>=1.2.0",              # PO/POT read/write for `grunt i18n` (i18n/extract.py)
    "pypdfium2>=5.13.0",
    "nh3>=0.3",
    "segno>=1.6.6",             # QR codes in print templates (grunt/print/filters.py)
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",       # async driver (runtime)
    "psycopg2-binary>=2.9.0", # sync driver for Alembic migrations
]
mysql = [
    "aiomysql>=0.2.0",       # async driver (runtime)
    "pymysql>=1.1.0",        # sync driver for Alembic migrations
]
redis = [
    "redis[hiredis]>=5.0.0",
]
docs = [
    "docxtpl>=0.16.8",
    "playwright>=1.40.0",
    "openpyxl>=3.1.0",
    "sqlparse>=0.5.0",
]

# Dev tooling lives in a dependency-group (PEP 735), NOT an extra: `uv sync`
# installs the default groups automatically, so a plain `uv sync` can never
# strip pytest/ruff/mypy the way `--extra`-gated deps get dropped.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["grunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole run: the in-memory test DB is a single shared
# connection (StaticPool), and its asyncio lock binds to the loop it first
# waited in - a per-test loop broke whichever later test contended for it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC"]
ignore = [
    "B008",  # FastAPI Depends() requires call in argument default
    "TC001", # Pydantic model fields need runtime imports for get_type_hints()
    "TC002", # same for third-party types used in Pydantic fields
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

# Checks enabled (subset of strict that the codebase satisfies)
warn_redundant_casts = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true
