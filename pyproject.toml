[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grunt"
version = "0.1.0"
description = "Metadata-driven application framework"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "click>=8.1.0",
    # Database (core — SQLAlchemy multi-DB)
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",       # SQLite async driver (dev/testing)
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.0",
    # Auth
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Logging
    "structlog>=24.1.0",
    # Logging output
    "rich>=13.7.0",
    # HTTP client (для internal requests)
    "httpx>=0.27.0",
    # Export (xlsx)
    "openpyxl>=3.1.0",
    # Background Jobs
    "taskiq>=0.11.0",
    "taskiq-redis>=0.5.0",
    "apscheduler>=3.10.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    "pywebpush>=2.0.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.6",
    "docxtpl>=0.16.8",
    "simpleeval>=1.0.7",
]

[project.scripts]
grunt = "grunt.cli.main:cli"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",       # async driver (runtime)
    "psycopg2-binary>=2.9.0", # sync driver for Alembic migrations
]
mysql = [
    "aiomysql>=0.2.0",       # async driver (runtime)
    "pymysql>=1.1.0",        # sync driver for Alembic migrations
]
redis = [
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.3.0",
]
docs = [
    "docxtpl>=0.16.8",
    "weasyprint>=62.0",
    "openpyxl>=3.1.0",
]
mfa = [
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
]
oauth = [
    "authlib>=1.3.0",
    "httpx>=0.27.0",
]
mkdocs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-autorefs>=1.0.0",
    "mkdocstrings[python]>=0.25.0",
    "griffe>=0.45.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",        # TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["grunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC"]
ignore = ["B008", "TC001"]  # FastAPI Depends() requires runtime imports for type resolution

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true

# Checks enabled (subset of strict that the codebase satisfies)
warn_redundant_casts = true
strict_equality = true
extra_checks = true
warn_unused_ignores = true
